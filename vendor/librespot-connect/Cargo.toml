# librespot-connect from crmne/librespot at
# 3ba977f1f918582edce566cfc16617f8eccdfb1e, with one change in
# src/spirc.rs: a Connect update naming another device as active does not
# stop a local file while it plays. Spotify refuses the state of a device
# playing a local file, so the cluster keeps naming the device that played
# before (Soloist), and its next update stopped the local file seconds in.
[package]
name = "librespot-connect"
version = "0.8.0"
rust-version = "1.85"
authors = ["Paul Lietar <paul@lietar.net>"]
license = "MIT"
description = "The Spotify Connect logic for librespot"
repository = "https://github.com/librespot-org/librespot"
edition = "2024"

[features]
default = ["native-tls"]
native-tls = ["librespot-core/native-tls"]
rustls-tls-native-roots = ["librespot-core/rustls-tls-native-roots"]
rustls-tls-webpki-roots = ["librespot-core/rustls-tls-webpki-roots"]

[dependencies]
librespot-core = { version = "0.8.0", default-features = false }
librespot-playback = { version = "0.8.0", default-features = false }
librespot-protocol = { version = "0.8.0", default-features = false }

futures-util = { version = "0.3", default-features = false, features = ["std"] }
log = "0.4"
protobuf = "3.7"
rand = { version = "0.9", default-features = false, features = ["small_rng"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync"] }
tokio-stream = { version = "0.1", default-features = false }
uuid = { version = "1.18", default-features = false, features = ["v4"] }
